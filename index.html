<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="./scripts/db.js"></script>
        <script src="./scripts/templates.js"></script>
        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css" />
        <!-- <link rel="stylesheet" href="./styles/layout.css" /> -->
        <!-- <link rel="stylesheet" href="./styles/fonts.css" /> -->
        <!-- <link rel="stylesheet" href="./styles/components.css" /> -->
    </head>
    <body onload="init()">
        <header>
            <img
                class="bestell-app-logo"
                src="./assets/icons/BestellAppLogo.svg"
                alt="Foto logo"
            />
            <img
                class="menu-bar"
                src="./assets/icons/menu.svg"
                alt="Foto logo"
            />
        </header>
        <div class="header-picture">
            <img src="./assets/img/header photo.png" alt="header foto" />
        </div>
        <div class="burger-logo">
            <img src="./assets/icons/Burger_logo.svg" alt="Burger Logo" />
        </div>
        <div class="logo-evaluation">
            <h1>BurgerHouse</h1>
            <img src="./assets/icons/Bewertung.png" alt="Bewertungen Foto" />
        </div>
        <p class="description-shop">
            The best of Burgers, Pizza, and Greens, all in one great place.
        </p>
        <div class="content_wrapper">
            
            <main>
                <section class="meals-section">
                    <h1>Gerichte</h1>
                    <!-- meals(Gerichte) werden hier über js dynamisch eingefügt -->
                    <div id="myDishes"></div>
                </section>
            </main>
            <!-- Warenkorb -->
            <section class="content-basket">
                content_basket
                <div class="basket" id="basket" >
                    <!-- Warenkorb wird hier dynamisch eingefügt -->
                    Warenkorb ist leer</div>
            </section>
        </div>

        <footer>
            <div class="footer">
                <div class="footer-tags">
                    <div class="copyright">
                        <img
                            src="./assets/icons/copyright.svg"
                            alt="Copyright Bild"
                        />
                        <p>2025 BurgerHouse</p>
                    </div>
                    <p>Imprint</p>
                    <p>Cookie Preferences</p>
                </div>
            </div>
        </footer>
    </body>
</html>
